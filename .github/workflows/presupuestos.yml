name: Presupuestos desde Drive

on:
  schedule:
    # 02:00 en Lima (UTC-5) = 07:00 UTC, de lunes a viernes
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet \
            google-api-python-client google-auth openpyxl

      - name: Leer presupuestos de Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/leer_presupuestos.py \
            --out public/data/presupuestos.json | tee salida.log

      - name: Publicar si hubo cambios
        run: |
          git config user.name  "PMO Bot"
          git config user.email "pmo-bot@efletexia.com"
          git add public/data/presupuestos.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los presupuestos"
          else
            git commit -m "Presupuestos: actualización automática $(date +%F)"
            git push
          fi

      - name: Resumen de la corrida
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          ruta = pathlib.Path("public/data/presupuestos.json")
          if not ruta.exists():
              print("## Presupuestos\n\nNo se generó el archivo.")
              raise SystemExit(0)
          d = json.loads(ruta.read_text(encoding="utf-8"))
          r = d["resumen"]
          print("## Presupuestos\n")
          print(f"- Archivos leídos: **{r['leidos']}**")
          print(f"- Cargados: **{r['cargados']}**")
          print(f"- Rechazados: **{r['rechazados']}**\n")
          if d.get("proyectos"):
              print("### Cargados\n\n| Proyecto | Archivo |\n|---|---|")
              for p in d["proyectos"]:
                  print(f"| {p['key']} | {p.get('archivo','')} |")
              print()
          if d.get("rechazos"):
              print("### Rechazados\n\n| Archivo | Motivo |\n|---|---|")
              for x in d["rechazos"]:
                  print(f"| {x['archivo']} | {x['motivo']} |")
          PY

      - name: Avisar rechazos
        if: always()
        run: |
          RECHAZOS=$(python -c "import json;print(json.load(open('public/data/presupuestos.json'))['resumen']['rechazados'])" 2>/dev/null || echo 0)
          if [ "$RECHAZOS" != "0" ]; then
            echo "::warning::$RECHAZOS archivo(s) rechazado(s) — ver el resumen de la ejecución"
          fi
