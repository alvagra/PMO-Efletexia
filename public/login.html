<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Acceso · Dashboard PMO</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:#0d1117 url('/fondo-login.jpg') center/cover no-repeat fixed;
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    color:#e7e9ec;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:linear-gradient(90deg,rgba(8,12,20,.88) 0%,rgba(8,12,20,.55) 55%,rgba(8,12,20,.35) 100%);
  }
  .tarjeta{
    position:relative;width:100%;max-width:380px;
    background:rgba(15,22,34,.82);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:34px 30px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .marca{text-align:center;margin-bottom:28px}
  .marca h1{font-size:20px;font-weight:600;margin:0;color:#fff;letter-spacing:.2px}
  .marca p{font-size:12px;color:#8b97a8;margin:5px 0 0;letter-spacing:.4px}
  .raya{width:38px;height:2px;background:#3B82F6;margin:16px auto 0;border-radius:2px}
  label{display:block;font-size:12px;color:#9aa6b6;margin-bottom:6px}
  input{
    width:100%;height:40px;padding:0 12px;margin-bottom:16px;font-size:14px;
    font-family:inherit;color:#fff;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);border-radius:7px;
    transition:border-color .15s,background .15s;
  }
  input::placeholder{color:#64748b}
  input:hover{border-color:rgba(255,255,255,.24)}
  input:focus{
    outline:none;border-color:#3B82F6;background:rgba(255,255,255,.09);
    box-shadow:0 0 0 3px rgba(59,130,246,.18);
  }
  button{
    width:100%;height:40px;font-size:14px;font-weight:500;font-family:inherit;
    color:#fff;background:#2563eb;border:none;border-radius:7px;cursor:pointer;
    transition:background .15s;
  }
  button:hover{background:#1d4ed8}
  button[disabled]{opacity:.6;cursor:default}
  .error{
    display:none;font-size:13px;color:#fca5a5;background:rgba(153,27,27,.35);
    border:1px solid rgba(239,68,68,.35);border-radius:7px;
    padding:10px 12px;margin-bottom:16px;line-height:1.45;
  }
  .nota{font-size:11px;color:#7c8899;text-align:center;line-height:1.6;margin:22px 0 0}
  @media (max-width:640px){
    body::before{background:rgba(8,12,20,.82)}
  }
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="marca">
      <h1>PMO Efletexia</h1>
      <div class="raya"></div>
    </div>

    <div class="error" id="error" role="alert"></div>

    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="username" autofocus />

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" />

    <button id="entrar" type="button">Ingresar</button>

    <p class="nota">Acceso restringido. Solicita tu cuenta al administrador del portafolio.</p>
  </main>

<script>
  const $usuario = document.getElementById('usuario');
  const $password = document.getElementById('password');
  const $boton = document.getElementById('entrar');
  const $error = document.getElementById('error');

  function mostrarError(texto){ $error.textContent = texto; $error.style.display = 'block'; }
  function limpiarError(){ $error.style.display = 'none'; }

  $usuario.addEventListener('input', limpiarError);
  $password.addEventListener('input', limpiarError);

  async function ingresar(){
    limpiarError();
    const usuario = $usuario.value.trim();
    const password = $password.value;

    if(!usuario){ mostrarError('Escribe tu usuario.'); $usuario.focus(); return; }
    if(!password){ mostrarError('Escribe tu contraseña.'); $password.focus(); return; }

    $boton.disabled = true;
    $boton.textContent = 'Verificando…';

    try{
      const r = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ usuario, password })
      });
      const data = await r.json();

      if(!r.ok){
        mostrarError(data.mensaje || 'No se pudo iniciar sesión. Intenta de nuevo.');
        $password.value = '';
        $password.focus();
        return;
      }

      const destino = new URLSearchParams(location.search).get('destino');
      location.href = destino && destino.startsWith('/') ? destino : '/';
    }catch(e){
      mostrarError('No hay conexión con el servidor. Intenta de nuevo.');
    }finally{
      $boton.disabled = false;
      $boton.textContent = 'Ingresar';
    }
  }

  $boton.addEventListener('click', ingresar);
  document.addEventListener('keydown', (e) => { if(e.key === 'Enter') ingresar(); });
</script>
</body>
</html>
